<h2>Iniciar sesión</h2>

<input
  type="email"
  placeholder="Correo"
  [(ngModel)]="correo">

<br><br>

<input
  type="password"
  placeholder="Contraseña"
  [(ngModel)]="password">

<br><br>

<button
  (click)="login()">

  Ingresar

</button>

<br><br>

<a routerLink="/register">
  Crear cuenta
</a>
