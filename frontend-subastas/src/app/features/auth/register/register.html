<h2>Registro</h2>

<input
  type="text"
  placeholder="Nombre"
  [(ngModel)]="nombre">

<br><br>

<input
  type="email"
  placeholder="Correo"
  [(ngModel)]="correo">

<br><br>

<input
  type="password"
  placeholder="Contraseña"
  [(ngModel)]="password">

<br><br>

<button
  (click)="register()">

  Crear cuenta

</button>

<br><br>

<a routerLink="/login">
  Ya tengo cuenta
</a>
