<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Prueba Socket.IO</title>
</head>
<body>

    <!-- Página mínima para comprobar la conexión y las notificaciones de una subasta. -->
    <h1>Cliente Socket.IO</h1>

    <!-- Al pulsarlo, el cliente se une al canal de la subasta con índice 0. -->
    <button onclick="suscribirse()">
        Suscribirse a subasta 0
    </button>

    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

    <script>

        // Abre la conexión en tiempo real con el servidor local de Socket.IO.
        const socket =
            io("http://localhost:5000");

        // Informa en la consola cuando la conexión queda establecida.
        socket.on(
            "connect",
            () => {

                console.log(
                    "✅ Conectado:",
                    socket.id
                );

            }
        );

        // Muestra en consola y en una alerta las nuevas pujas del canal suscrito.
        socket.on(
            "nueva-puja",
            (data) => {

                console.log(
                    "🔥 Nueva puja recibida:",
                    data
                );

                alert(
                    "Nueva puja: " +
                    JSON.stringify(data)
                );

            }
            
        );

        // Avisa al cliente cuando otro participante supera la puja de un usuario.
        socket.on(
            "usuario-superado",
            (data) => {

                console.log(
                    "⚠️ Usuario superado:",
                    data
                );

                alert(
                    "Usuario superado: " +
                    JSON.stringify(data)
                );

            }
        );

        // Informa cuando la subasta a la que está suscrito ha sido cerrada.
        socket.on(
            "subasta-cerrada",
            (data) => {

                console.log(
                    "🔒 Subasta cerrada:",
                    data
                );

                alert(
                    "Subasta cerrada: " +
                    JSON.stringify(data)
                );

            }
        );

        // Solicita al servidor unirse a la sala de Socket.IO de la subasta 0.
        function suscribirse() {

            socket.emit(
                "suscribirse-subasta",
                0
            );

            console.log(
                "✅ Suscrito a subasta 0"
            );

        }

    </script>

</body>
</html>
